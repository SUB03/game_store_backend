services:
    postgres:
        image: postgres:18
        container_name: postgres
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: learning
        volumes:
            - pgdata:/var/lib/postgresql
    auth_service:
        build:
            context: .
            dockerfile: ./auth_service/dockerfile
        container_name: auth_service
        env_file:
            - .env
    store_service:
        build:
            context: .
            dockerfile: ./store_service/dockerfile
        container_name: store_service
        env_file:
            - .env
    payment_service:
        build:
            context: .
            dockerfile: ./payment_service/dockerfile
        container_name: payment_service
        env_file:
            - .env
    users_service:
        build:
            context: .
            dockerfile: ./users_service/dockerfile
        container_name: users_service
        env_file:
            - .env
    
    victorialogs:
        image: victoriametrics/victoria-logs:v1.52.0
        container_name: victorialogs
        command:
            - -storageDataPath=/victoria-logs-data
        volumes:
            - vl_data:/victoria-logs-data
        restart: unless-stopped
    
    vmagent:
        image: victoriametrics/vmagent:v1.148.0
        container_name: vmagent
        depends_on:
            - victoriametrics
        command:
            - "-promscrape.config=/etc/vmagent/prometheus.yml"
            - "-remoteWrite.url=http://victoriametrics:8428/api/v1/write"
            - "-promscrape.config.strictParse=false"
        volumes:
            - ./vmagent/prometheus.yml:/etc/vmagent/prometheus.yml:ro
    
    victoriametrics:
        image: victoriametrics/victoria-metrics:v1.148.0
        container_name: victoriametrics
        command:
            - "-storageDataPath=/victoria-metrics-data"
            - "-retentionPeriod=30d"
        volumes:
            - vm_data:/victoria-metrics-data
        restart: unless-stopped
    
    grafana:
        image: grafana/grafana:13.0
        container_name: grafana
        environment:
            GF_SECURITY_ADMIN_USER: admin
            GF_SECURITY_ADMIN_PASSWORD: admin
            GF_AUTH_ANONYMOUS_ENABLED: "false"
            GF_INSTALL_PLUGINS: victoriametrics-logs-datasource
        volumes:
            - grafana_data:/var/lib/grafana
            - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
            - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
        depends_on:
            - victoriametrics
        restart: unless-stopped
    
    frontend:
        container_name: frontend
        env_file:
            - .env
        environment:
            - AUTH_SERVICE_URL=http://auth_service:8000
            - STORE_SERVICE_URL=http://store_service:8001
            - PAYMENT_SERVICE_URL=http://payment_service:8002
            - USERS_SERVICE_URL=http://users_service:8003
        depends_on:
            - auth_service
            - store_service
            - payment_service
            - users_service

volumes:
    pgdata:
    vl_data:
    vm_data:
    grafana_data: