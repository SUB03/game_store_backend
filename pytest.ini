[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
addopts =
    --cov=auth_service
    --cov=store_service
    --cov=users_service
    --cov=payment_service
    --cov-report=term-missing
    --cov-report=xml
    --cov-report=html
markers =
    integration: tests that need a real PostgreSQL (started via Docker)
filterwarnings =
    ignore::DeprecationWarning

[coverage:run]
source =
    auth_service
    store_service
    users_service
    payment_service
omit =
    */alembic/*
